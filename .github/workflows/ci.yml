name: CI
on:
  push:
    branches: [main, chad]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: icewater
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: icewater
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U icewater -d icewater" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://icewater:ci-only-password@localhost:5432/icewater
      TEST_DATABASE_URL: postgresql://icewater:ci-only-password@localhost:5432/icewater
      GUEST_SESSION_SIGNING_SECRET: ci-only-signing-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:load
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/
          retention-days: 7
